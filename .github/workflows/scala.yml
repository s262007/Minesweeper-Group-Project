# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Scala CI

on:
  push:
    branches: [ "main" ]
  # Every pull request, including stacked PRs that target a story branch.
  pull_request:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      # Chisel/FIRRTL elaboration of the production-capacity top uses deep
      # recursive compiler passes; give the CI JVM a larger thread stack.
      JAVA_TOOL_OPTIONS: -Xss8m

    steps:

    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Setup sbt
      uses: sbt/setup-sbt@v1
    - name: Run tests
      run: sbt test

  formal-tools:
    runs-on: ubuntu-latest
    steps:
    - name: Install Z3
      run: sudo apt-get update && sudo apt-get install -y z3
    - name: Check Z3 executable
      run: z3 -version
    # R2-S0 adds the formal smoke harness and expected-failure check.
    # Tool availability alone does not establish a passing formal property.

