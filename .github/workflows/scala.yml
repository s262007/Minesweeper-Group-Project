# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Scala CI

on:
  push:
    branches: [ "main" ]
  # Every pull request, including stacked PRs that target a story branch.
  pull_request:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      # Chisel/FIRRTL elaboration of the production-capacity top uses deep
      # recursive compiler passes; give the CI JVM a larger thread stack.
      JAVA_TOOL_OPTIONS: -Xss8m

    steps:

    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Setup sbt
      uses: sbt/setup-sbt@v1
    - name: Run tests
      # Formal proofs need z3; they run in the formal-tools job.
      run: sbt "testOnly -- -l minesweeper.Formal"

  formal-tools:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Xss8m
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Setup sbt
      uses: sbt/setup-sbt@v1
    - name: Install Z3
      run: sudo apt-get update && sudo apt-get install -y z3
    - name: Check Z3 executable
      run: z3 -version
    # FormalSmokeTest proves a true property and expects a counterexample for a false one,
    # so a tool that cannot fail is noticed. Then the Solver and RevealEngine proofs.
    - name: Run formal proofs
      run: sbt "testOnly -- -n minesweeper.Formal"

